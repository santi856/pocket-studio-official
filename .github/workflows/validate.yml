name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pocket_studio
          POSTGRES_PASSWORD: pocket_studio
          POSTGRES_DB: pocket_studio_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://pocket_studio:pocket_studio@localhost:5432/pocket_studio_dev
      TEST_DATABASE_URL: postgresql://pocket_studio:pocket_studio@localhost:5432/pocket_studio_test
      SESSION_SECRET: ci-only-session-secret-not-a-real-value-do-not-reuse
      # Must be exactly 32 bytes once base64-decoded (AES-256-GCM,
      # src/lib/credentials/crypto.ts) — verified with
      # `python3 -c "import base64; print(len(base64.b64decode('...')))"`.
      CREDENTIAL_ENCRYPTION_KEY: Y2ktb25seS10ZXN0LWtleS0zMi1ieXRlcy1sb25nISE=
      AI_PROVIDER: mock
      BILLING_PROVIDER: mock
      GENERATED_APP_PAYMENT_PROVIDER: mock
      EMAIL_PROVIDER: mock

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Create the separate integration-test database
        run: |
          PGPASSWORD=pocket_studio psql -h localhost -U pocket_studio -d pocket_studio_dev \
            -c "CREATE DATABASE pocket_studio_test OWNER pocket_studio;"

      - run: npm run db:generate
      - run: npm run db:deploy
      - name: Apply migrations to the separate integration-test database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e
        env:
          CI: true
